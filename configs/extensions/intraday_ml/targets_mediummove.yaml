# Medium-Move Target Configuration (2–4h moves, moderate magnitude)

label_type: "triclass_atr_threshold"

horizons:
  - 120   # 2 hours
  - 240   # 4 hours

# Aim for “decent” moves (higher base rate than big-move). Target roughly 0.5–2% positives.
atr_multiplier: 0.8
atr_multiplier_long: 0.85
atr_multiplier_short: 0.9

# Slightly longer ATR for stability.
atr_window: 21
atr_period_minutes: 1

volatility_scaling:
  enabled: true
  target_move_pct: 0.008     # ~0.8% base move target
  price_quantile: 0.6
  atr_quantile: 0.85
  mix: 0.6
  multiplier_bounds:
    min: 0.008
    max: 0.08

directional_balance:
  enabled: true
  target_ratio: 1.0
  tolerance: 0.25
  max_iterations: 10
  adjust_step: 0.06
  growth_factor: 0.65
  min_directional: 10
  multiplier_bounds:
    min: 0.008
    max: 0.09

first_hit_logic:
  enabled: true
  stop_at_hit: true
  min_bars_required: 3

session_constraints:
  timezone: "America/New_York"
  session_open: "09:30"
  session_close: "16:00"
  min_minutes_after_open: 10
  max_minutes_before_close: 20

min_realized_return_pct: 0.0
min_observations_per_horizon: 8
max_lookback_bars: 240
require_min_atr: 0.004
exclude_flat_periods: true
include_metadata: true
validate_no_peek: true

risk_reward:
  enabled: true
  min_r_multiple: 1.2              # allow supervised labels that can deliver ≥1.2R
  stop_atr_multiplier_long: 0.9
  stop_atr_multiplier_short: 1.0
  target_buffer: 0.0004
  atr_return_bounds:
    min: 0.0004
    max: 0.06

big_move:
  enabled: true
  label_name: "y_mediummove"
  direction_label_name: "y_mediummove_direction"
  forward_return_column: "fwd_return_mediummove"
  atr_column: "f__vol__atr_6"
  price_column: "close"
  bar_minutes: 10
  forward_minutes: 120        # primary horizon 2h
  forward_minutes_alt: 240    # secondary horizon 4h
  atr_multiple: 0.8
  min_return_floor_pct: 0.004 # ~0.4% floor
  atr_is_return_pct: true
  realized_r_label: "realized_r_mediummove"
  realized_r_floor: -3.0
  realized_r_cap: 3.0
  metadata:
    description: "Medium-move labels (>= max(0.8*ATR, 0.4%) over 2–4h) for supervised training"
