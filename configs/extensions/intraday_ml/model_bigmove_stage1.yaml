# LightGBM config for Stage 1 big-move probability model.

seed: 37

lgbm_params:
  learning_rate: 0.045
  n_estimators: 640
  num_leaves: 64
  max_depth: -1
  min_child_samples: 45
  subsample: 0.85
  subsample_freq: 1
  colsample_bytree: 0.9
  reg_alpha: 0.15
  reg_lambda: 0.35
  min_split_gain: 0.0
  verbose: -1

training:
  n_folds: 5
  seed: 37
  decision_threshold: 0.5
  class_weight: balanced
