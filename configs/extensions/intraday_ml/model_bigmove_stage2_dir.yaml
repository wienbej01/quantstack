# LightGBM config for Stage 2 big-move direction classifier.

seed: 41

lgbm_params:
  learning_rate: 0.05
  n_estimators: 480
  num_leaves: 48
  max_depth: -1
  min_child_samples: 35
  subsample: 0.85
  subsample_freq: 1
  colsample_bytree: 0.85
  reg_alpha: 0.1
  reg_lambda: 0.25
  min_split_gain: 0.0
  verbose: -1

training:
  n_folds: 4
  seed: 41
  decision_threshold: 0.5
  class_weight: balanced
