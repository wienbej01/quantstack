# Big-Move Target Configuration
# Focus on higher-magnitude directional moves for Sprint 2 experiments.

label_type: "triclass_atr_threshold"

# Shorter horizons for better predictability with OHLCV features
horizons:
  - 15
  - 30
  - 45

# ATR multipliers operate on ATR expressed as a return (% of price) so moves
# align with ≥1.5R payoffs once paired with risk_reward parameters below.
atr_multiplier: 1.10
atr_multiplier_long: 1.15
atr_multiplier_short: 1.20

# Slightly longer ATR to stabilise volatility estimates.
atr_window: 21
atr_period_minutes: 1

volatility_scaling:
  enabled: true
  target_move_pct: 0.012
  price_quantile: 0.6
  atr_quantile: 0.85
  mix: 0.6
  multiplier_bounds:
    min: 0.01
    max: 0.12

directional_balance:
  enabled: true
  target_ratio: 1.0
  tolerance: 0.25
  max_iterations: 10
  adjust_step: 0.06
  growth_factor: 0.65
  min_directional: 10
  multiplier_bounds:
    min: 0.01
    max: 0.13

first_hit_logic:
  enabled: true
  stop_at_hit: true
  min_bars_required: 2

session_constraints:
  timezone: "America/New_York"
  session_open: "09:30"
  session_close: "16:00"
  min_minutes_after_open: 10   # avoid opening auction noise
  max_minutes_before_close: 15 # ensure ample time for exits

min_realized_return_pct: 0.0

min_observations_per_horizon: 8
max_lookback_bars: 180
require_min_atr: 0.005
exclude_flat_periods: true
include_metadata: true
validate_no_peek: true

risk_reward:
  enabled: true
  min_r_multiple: 1.5
  stop_atr_multiplier_long: 0.85
  stop_atr_multiplier_short: 0.95
  target_buffer: 0.0005
  atr_return_bounds:
    min: 0.0005
    max: 0.08

big_move:
  enabled: true
  label_name: "y_bigmove"
  direction_label_name: "y_bigmove_direction"
  forward_return_column: "fwd_return_bigmove"
  atr_column: "f__vol__atr_6"
  price_column: "close"
  bar_minutes: 10
  forward_minutes: 30        # evaluate ~30 minutes into the future (shortened from 60)
  forward_minutes_alt: 45    # optional secondary horizon (shortened from 120)
  atr_multiple: 1.5
  min_return_floor_pct: 0.0075
  atr_is_return_pct: false
  realized_r_label: "realized_r_bigmove"
  realized_r_floor: -5.0
  realized_r_cap: 5.0
  metadata:
    description: "ATR big-move labels (>= max(K*ATR, floor)) for Sprint 3"
