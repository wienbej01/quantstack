# Master config for Phase A pipeline
artifacts: 'artefacts/extensions/intraday_ml/phaseA'

data:
  family: 'bars_10m'

includes:
  universe: 'configs/extensions/intraday_ml/universe_single.yaml'
  splits: 'configs/extensions/intraday_ml/splits_pilot.yaml'
  cuts: 'configs/extensions/intraday_ml/cuts_10m.yaml'
  features: 'configs/extensions/intraday_ml/features_10m.yaml'
  targets: 'configs/extensions/intraday_ml/targets_loose.yaml'
  model: 'configs/extensions/intraday_ml/model_lgbm.yaml'
  cv: 'configs/extensions/intraday_ml/cv/phaseA.yaml'

policy:
  prob_threshold_long: 0.62
  prob_threshold_short: 0.62
  cooldown_minutes: 20
  min_time: "09:40:00"
  max_time: "15:50:00"
  stop_loss_pct: 0.006
  take_profit_pct: 0.009
  order_qty: 100
  exit_threshold_long: 0.58
  exit_threshold_short: 0.58
  max_hold_minutes: 90
  score_margin: 0.08
  min_directional_gap: 0.18
  min_conviction_score: 0.3
  max_entries_per_day:
  gap_exit_delay_minutes: 10
  calibration:
    enabled: true
    quantiles: [0.5, 0.7, 0.85, 0.95]
    prob_long_percentile: 0.8
    prob_short_percentile: 0.8
    gap_percentile: 0.75
    conviction_percentile: 0.75
    prob_exit_offset: 0.05
    min_samples: 200
    max_samples_per_symbol: 5000
    stats_filename: "policy_calibration.json"
