# Master config for multi-ticker Phase A training / deployment
artifacts: 'artefacts/extensions/intraday_ml/phaseA_multi'

data:
  family: 'bars_10m'

includes:
  universe: 'configs/extensions/intraday_ml/universe_phaseA_multi.yaml'
  splits: 'configs/extensions/intraday_ml/splits_2024_multi.yaml'
  cuts: 'configs/extensions/intraday_ml/cuts_10m.yaml'
  features: 'configs/extensions/intraday_ml/features_10m.yaml'
  targets: 'configs/extensions/intraday_ml/targets_loose.yaml'
  model: 'configs/extensions/intraday_ml/model_lgbm.yaml'
  cv: 'configs/extensions/intraday_ml/cv/phaseA.yaml'

training_symbols: ["TTD", "BKR", "BALL", "USB", "GIS"]
deployment_symbols: ["GIS", "LYB", "EXC"]

policy:
  prob_threshold_long: 0.55
  prob_threshold_short: 0.55
  cooldown_minutes: 20
  min_time: "09:40:00"
  max_time: "15:50:00"
  stop_loss_pct: 0.006
  take_profit_pct: 0.009
  order_qty: 100
  exit_threshold_long: 0.5
  exit_threshold_short: 0.5
  max_hold_minutes: 90
  score_margin: 0.05
  min_directional_gap: 0.06
  min_conviction_score: 0.015
  gap_exit_delay_minutes: 15
  conviction_decay_min_hold_minutes: 30
  conviction_decay_gap_multiplier: 0.6
  conviction_decay_conv_multiplier: 0.6
  calibration:
    enabled: true
    quantiles: [0.5, 0.7, 0.85, 0.95]
    prob_long_percentile: 0.8
    prob_short_percentile: 0.8
    gap_percentile: 0.75
    conviction_percentile: 0.75
    prob_exit_offset: 0.05
    floors:
      prob_threshold_long: 0.52
      prob_threshold_short: 0.52
      exit_threshold_long: 0.48
      exit_threshold_short: 0.48
      min_directional_gap: 0.05
      min_conviction_score: 0.012
    ceilings:
      prob_threshold_long: 0.8
      prob_threshold_short: 0.8
      min_directional_gap: 0.3
      min_conviction_score: 0.4
    bias_correction:
      enabled: true
      metric: "mean"
      scale: 0.6
      max_adjustment: 0.06
      apply_to_exit: true
    min_samples: 200
    max_samples_per_symbol: 5000
    stats_filename: "policy_calibration.json"
