# Loose LightGBM model configuration
model_type: "lightgbm"
objective: "multiclass"
num_class: 3
metric: "multi_logloss"

lgbm_params:
  num_leaves: 31
  max_depth: -1
  learning_rate: 0.05
  n_estimators: 200
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_jobs: -1
  verbose: -1

# Class weights to handle imbalanced directional classes
class_weights:
  -1: 1.8
  0: 0.4
  1: 1.8

training:
  early_stopping_rounds: 20
  eval_metric: "multi_logloss"
  validation_split: 0.2
  shuffle: true

calibration:
  enabled: true

reproducibility:
  seed: 42
