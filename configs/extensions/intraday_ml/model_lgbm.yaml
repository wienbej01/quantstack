# Intraday ML LightGBM Model Configuration (Sprint 2 big-move focus)
# Tri-class classifier tuned for sparse, high-conviction targets.

# Model architecture
model_type: "lightgbm"
objective: "multiclass"
num_class: 3  # {-1, 0, +1}
metric: "multi_logloss"

# LightGBM hyperparameters
lgbm_params:
  num_leaves: 64
  max_depth: -1
  learning_rate: 0.018
  n_estimators: 900
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.7
  reg_alpha: 0.25
  reg_lambda: 0.9
  min_child_samples: 35
  min_split_gain: 0.05
  random_state: 42
  deterministic: true
  n_jobs: -1
  verbose: -1

# Class weights (to handle class imbalance)
class_weights:
  base:
    # emphasize directional hits without starving neutral class
    -1: 2.4
    0: 1.0
    1: 2.4
  auto_balance:
    enabled: true
    mix: 0.45
    target_ratio: 1.0
    tolerance: 0.12
    ratio_adjust: 0.35
    equalize_directional: true
    neutral_weight_floor: 0.85
    neutral_weight_cap: 1.15
    missing_class_weight: 1.8
    min_weight: 0.08
    max_weight: 5.0
    normalize: true

loss_tuning:
  focal_loss:
    enabled: false
    gamma: 1.4
    alpha:
      -1: 1.0
      0: 0.4
      1: 1.0

# Training parameters
training:
  early_stopping_rounds: 75
  eval_metric: "multi_logloss"
  validation_split: 0.2
  shuffle: false
  stratify_by_class: false
  abstention_guard:
    max_trade_density: 0.45
    min_abstention_rate: 0.55
    fail_on_worse_than_baseline: false
  topk_objective:
    enabled: true
    bars_per_day: 39
    trades_per_day:
      - 3
      - 5

# Probability calibration
calibration:
  enabled: true
  method: "isotonic"
  cv_folds: 5

# Decision policy parameters
decision_policy:
  probability_threshold: 0.7
  expected_move_multiplier: 1.1
  cooldown:
    base_minutes: 20
    atr_multiplier: 0.6
    max_minutes: 75
  time_filter:
    first_minutes_after_open: 5
    high_confidence_threshold: 0.85
  force_flat_before_close: "15:58:00"

# Feature selection
feature_selection:
  enabled: false
  method: "importance"
  top_k: 60

# Model evaluation
evaluation:
  metrics:
    - "accuracy"
    - "precision_macro"
    - "recall_macro"
    - "f1_macro"
    - "brier_score"
    - "log_loss"
  cross_validation:
    enabled: true
    folds: 5
    stratify: true

# Model saving and versioning
model_io:
  version_format: "v{major}.{minor}.{patch}"
  save_format: "joblib"  # Options: "joblib", "pickle"
  compression: true

  # Include in model card
  include_training_data: false
  include_predictions: false
  include_feature_importance: true
  include_calibration_metrics: true

# Performance requirements
performance:
  max_training_time_minutes: 45
  max_inference_time_ms: 12
  max_memory_gb: 4

# Reproducibility
reproducibility:
  seed: 42
  bagging_seed: 1337
  feature_fraction_seed: 9001
  deterministic: true
  save_random_state: true
