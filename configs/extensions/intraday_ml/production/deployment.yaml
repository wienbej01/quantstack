# Production deployment configuration
deployment:
  type: "kubernetes"  # "docker" or "kubernetes"
  namespace: "ml-production"
  environment: "production"

# Container configuration
container:
  image_registry: "your-registry.com"
  image_tag: "latest"
  pull_policy: "Always"
  restart_policy: "Always"

# Resource allocation
resources:
  default:
    cpu_request: "100m"
    memory_request: "256Mi"
    cpu_limit: "500m"
    memory_limit: "1Gi"

  high_performance:
    cpu_request: "500m"
    memory_request: "512Mi"
    cpu_limit: "2000m"
    memory_limit: "4Gi"

  inference_optimized:
    cpu_request: "1000m"
    memory_request: "2Gi"
    cpu_limit: "4000m"
    memory_limit: "8Gi"
    enable_gpu: false

# Auto-scaling configuration
autoscaling:
  enabled: true
  min_replicas: 1
  max_replicas: 10
  target_cpu_utilization: 70
  target_memory_utilization: 80
  scale_up_cooldown: 60
  scale_down_cooldown: 300

# Network configuration
network:
  service_type: "ClusterIP"
  load_balancer_type: "none"  # "none", "internal", "external"
  ingress_enabled: false
  node_port: 30001

# Health checks
health_checks:
  liveness:
    enabled: true
    path: "/health"
    port: 8000
    initial_delay_seconds: 60
    period_seconds: 10
    timeout_seconds: 5
    failure_threshold: 3

  readiness:
    enabled: true
    path: "/ready"
    port: 8000
    initial_delay_seconds: 30
    period_seconds: 5
    timeout_seconds: 3
    failure_threshold: 3

  startup:
    enabled: true
    path: "/health"
    port: 8000
    failure_threshold: 30
    period_seconds: 10
    timeout_seconds: 5

# Environment variables
environment:
  common:
    LOG_LEVEL: "INFO"
    ENVIRONMENT: "production"
    METRICS_ENABLED: "true"

  secrets:
    - name: "DATABASE_URL"
      secret_name: "ml-secrets"
      secret_key: "database-url"
    - name: "API_KEY"
      secret_name: "ml-secrets"
      secret_key: "api-key"

# Volume mounts
volumes:
  - name: "model-cache"
    mount_path: "/app/models/cache"
    size: "1Gi"
    storage_class: "fast-ssd"

  - name: "logs"
    mount_path: "/app/logs"
    size: "500Mi"
    storage_class: "standard"

# Node selection
node_selector:
  enabled: false
  labels:
    node-type: "ml-serving"
    hardware: "cpu-optimized"

  tolerations:
    - key: "ml-workload"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

# Pod disruption budget
disruption_budget:
  enabled: true
  min_available: 1
  max_unavailable: 1

# Rolling update strategy
rolling_update:
  max_unavailable: 1
  max_surge: 1
  progress_deadline_seconds: 600

# Service mesh integration
service_mesh:
  enabled: false
  istio:
    enabled: false
    mTLS: "STRICT"
    traffic_policy: "LOCAL"

# Monitoring integration
monitoring:
  prometheus:
    enabled: true
    port: 9090
    path: "/metrics"
    scrape_interval: "30s"

  jaeger:
    enabled: false
    endpoint: "http://jaeger-collector:14268/api/traces"

  grafana:
    enabled: false
    dashboard_config: "monitoring/grafana-dashboards"

# Backup and recovery
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention_days: 30
  storage_class: "standard"

# Security policies
security:
  pod_security_policy:
    enabled: true
    run_as_non_root: true
    read_only_root_filesystem: false
    allow_privilege_escalation: false

  network_policy:
    enabled: true
    ingress:
      - from:
        - namespaceSelector:
            matchLabels:
              name: "ml-production"
      ports:
        - protocol: TCP
          port: 8000
    egress:
      - to: []
        ports:
          - protocol: TCP
            port: 443
          - protocol: TCP
            port: 53
          - protocol: UDP
            port: 53

# Deployment strategies
deployment_strategies:
  blue_green:
    enabled: false
    active_service: "ml-model-active"
    preview_service: "ml-model-preview"
    switch_threshold: 0.99

  canary:
    enabled: false
    initial_weight: 10
    step_weight: 10
    step_interval_seconds: 300
    analysis_template: "canary-analysis"

# Multi-region deployment
multi_region:
  enabled: false
  regions:
    - name: "us-east-1"
      primary: true
      weight: 70
    - name: "us-west-2"
      primary: false
      weight: 30

  traffic_routing:
    type: "weighted"  # "weighted", "geographic", "latency"
    failover: true
    health_check_interval: 30