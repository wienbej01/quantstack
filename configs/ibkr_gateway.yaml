host: "127.0.0.1"
port: 7497
process_patterns:
  - "ibgateway"
  - "tws"
zombie_threshold: 10
gateway_service: "ibkr-gateway.service"
services:
  - "l2-scalping"
  - "l2-collector"
  - "intraday-paper"
use_sudo: false
use_user_systemctl: true
gateway_startup_wait_seconds: 30
gateway_stop_wait_seconds: 10
service_start_delay_seconds: 5
service_start_timeout_seconds: 45
expected_client_ids:
  l2_scalping:
    - 20
    - 21
  l2_collector:
    - 521
  intraday_paper:
    - 998
    - 11
