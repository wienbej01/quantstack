# Regime detection disabled configuration (baseline comparison)
gold_root: "/home/jacobw/gcs-mount"
family: "stocks"
symbols: ["AAPL", "MSFT", "GOOGL", "AMZN", "TSLA", "META", "NVDA"]
dates: ["2024-01-02", "2024-01-03", "2024-01-04", "2024-01-05", "2024-01-08", "2024-01-09", "2024-01-10", "2024-01-11", "2024-01-12", "2024-01-15", "2024-01-16", "2024-01-17", "2024-01-18", "2024-01-19", "2024-01-22"]

# Only core features - no regime features
features:
  - name: "core_basics"
    params:
      vwap_window_m: 30
      rel_vol_window_m: 30
      atr_window: 14

# Regime detection disabled
regime:
  enabled: false  # Disabled for baseline comparison

# Standard policy
policy: "vwap_revert"
policy_params:
  rvol_min: 1.0
  vwap_window_m: 30
  max_position_bars: 50

# Standard risk management (no regime adjustments)
risk: "atr_stop"
risk_params:
  max_risk_frac: 0.02
  atr_mult: 2.0

# Backtest configuration
backtest:
  initial_equity: 1000000
  cost_bps: 5
  cost_per_share: 0.0035

# Experiment metadata
seed: 42
description: "Baseline configuration with regime detection disabled"

# SIP configuration (optional)
sip_filter: false