# Regime-aware strategy comparison configuration
gold_root: "/home/jacobw/gcs-mount"
family: "stocks"
symbols: ["AAPL", "MSFT", "GOOGL", "AMZN", "TSLA", "META", "NVDA", "NFLX", "AMD", "INTC"]
dates: ["2024-01-01", "2024-01-02", "2024-01-03", "2024-01-04", "2024-01-05", "2024-01-08", "2024-01-09", "2024-01-10", "2024-01-11", "2024-01-12", "2024-01-15", "2024-01-16", "2024-01-17", "2024-01-18", "2024-01-19", "2024-01-22", "2024-01-23", "2024-01-24", "2024-01-25", "2024-01-26", "2024-01-29", "2024-01-30", "2024-01-31"]

# Feature configuration with both regime and core features
features:
  - name: "regime_basics"
    params: {}
  - name: "core_basics"
    params:
      vwap_window_m: 30
      rel_vol_window_m: 30
      atr_window: 14

# Regime detection configuration - more sensitive
regime:
  enabled: true
  model: "rules"
  persistence_bars: 2  # Lower persistence for more responsive testing
  cooldown_minutes: 10

  # Different strategy mapping for comparison
  strategy_map:
    BULL: ["vwap_momentum", "vwap_revert"]
    BEAR: ["vwap_revert"]
    SIDEWAYS: ["vwap_revert"]
    STRESS: ["vwap_revert"]  # Allow limited trading in stress

  # More sensitive detector parameters
  detector_params:
    variance_ratio_bull: 1.15
    variance_ratio_bear: 0.85
    adx_trend_threshold: 25.0
    volatility_stress_threshold: 1.8
    volatility_high_threshold: 1.4
    volatility_low_threshold: 0.75
    stress_vol_threshold: 1.8
    stress_volume_threshold: 2.5
    sideways_band_min: 0.25
    sideways_band_max: 0.75
    variance_ratio_weight: 0.45
    adx_weight: 0.35
    volatility_weight: 0.15
    band_position_weight: 0.05

# Default policy (will be overridden in variants)
policy: "vwap_revert"
policy_params:
  rvol_min: 1.0
  vwap_window_m: 30
  max_position_bars: 50

# Risk management with regime adjustments
risk: "atr_stop"
risk_params:
  max_risk_frac: 0.02
  atr_mult: 2.0
  regime_adjustments:
    BULL:
      risk_multiplier: 1.1
      atr_multiplier: 0.9
    BEAR:
      risk_multiplier: 0.7
      atr_multiplier: 1.3
    SIDEWAYS:
      risk_multiplier: 0.85
      atr_multiplier: 1.15
    STRESS:
      risk_multiplier: 0.4
      atr_multiplier: 1.6
    OFF:
      risk_multiplier: 1.0
      atr_multiplier: 1.0

# Backtest configuration
backtest:
  initial_equity: 1000000
  cost_bps: 5
  cost_per_share: 0.0035

# Experiment metadata
seed: 42
description: "Regime-aware strategy comparison with different regime mappings"

# SIP configuration (optional)
sip_filter: false