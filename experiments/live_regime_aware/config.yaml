name: "Production Regime-Aware Trading"
description: "Live SIP selection, paper trading, and strategic L2 collection"

data:
  polygon:
    api_key: ${POLYGON_API_KEY}
    
  l2:
    enabled: true
    host: "127.0.0.1"
    port: 7497
    client_id: 300
    max_symbols: 6  # Maximize subscription usage
    levels: 10
    rotate_seconds: 600  # 10 minutes
    output_dir: "./data/production_l2"
    windows: "09:30-10:30,15:00-16:00"  # Opening + power hour

sip:
  method: "polygon_hmm"
  config:
    top_k: 40
    score_floor: 0.1

strategy:
  type: "regime_aware_ml"
  model_path: "./models/regime_aware"
  
  # Trading thresholds
  buy_threshold: 0.65
  sell_threshold: 0.35
  position_size: 100
  
  # Paper trading settings
  paper_mode: true
  max_positions: 20

risk:
  max_daily_trades: 50
  max_position_size: 1000
  
execution:
  broker: "ibkr"
  host: "127.0.0.1"
  port: 7497
  client_id: 400

logging:
  level: "INFO"
  file: "./logs/production_trading.log"
