# Base VWAP Revert Strategy Configuration for Sprint 7 Testing

# Data configuration - using real Gold data
gold_root: "/home/jacobw/gcs-mount/gold"
family: "bars_1m"
symbols: ["AAPL", "MSFT", "GOOGL"]
dates: ["2024-01"]

# Feature engineering configuration
features:
  - "core_basics"

# SIP filter configuration (enabled for fairness testing)
sip_filter: true
sip:
  method: "original"
  top_n: 3

# Policy configuration
policy: "vwap_revert"
policy_params:
  vwap_lookback_m: 10
  deviation_threshold: 0.02
  min_rvol: 1.0
  max_position_bars: 10
  risk_params:
    max_risk_frac: 0.02
    atr_mult: 2.0

# Backtest configuration
backtest:
  initial_equity: 100000.0
  cost_per_share: 0.003
  commission_min: 0.0
  cost_bps: 0.001

# Experiment configuration
seed: 42