# HMM SIP overlay - enables HMM SIP selector with top 40 symbols
# This overlay enables the new HMM SIP universe selection

sip:
  method: hmm      # Use the HMM SIP selector
  top_k: 40         # Select top 40 symbols
  score_floor: 0.0
  enable_gold_fallback: true
  external_premarket_root: "~/hybrid-local/signals/sip/universe/pre"
  p_hat_threshold: null
  min_minutes_in_state: 0