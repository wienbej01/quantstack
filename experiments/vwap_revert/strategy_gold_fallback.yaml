# Strategy configuration for testing Gold-only fallback
# Uses a date (Christmas) when external HMM SIP files don't exist

gold_root: "/home/jacobw/gcs-mount"
family: "stocks"
symbols: ["AAPL", "GOOGL", "MSFT"]
dates: ["2024-12-25"]  # Christmas - no external files, triggers Gold fallback
features:
  - name: "core_basics"
    params:
      vwap_window_m: 30
      rel_vol_window_m: 30
      atr_window: 14
policy: "vwap_revert"
policy_params:
  rvol_min: 1.0
  vwap_window_m: 30
  max_position_bars: 50
risk: "atr_stop"
risk_params:
  max_risk_frac: 0.02
  atr_mult: 2.0
backtest:
  initial_equity: 1000000
  cost_bps: 5
  cost_per_share: 0.0035
seed: 42
sip_filter: true
sip:
  top_n: 5
  rvol_col: "f__vol__rel_volume_30"
  whitelist: null