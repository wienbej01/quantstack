# L2 Scalping System Configuration

# Strategy Parameters
strategy:
  name: "L2_OBI_Momentum_Scalper"
  version: "2.0"  # Updated with pattern rules
  
  # Signal thresholds (original OBI momentum rule)
  obi_entry_threshold: 0.8      # OBI level for entry signals (raised from 0.3)
  obi_extreme_threshold: 0.9    # High conviction threshold
  min_confidence: 0.3           # Minimum signal confidence
  max_spread_multiple: 2.0      # Max spread vs median
  confirm_k: 2                  # Regime confirmation window
  calibration_window_points: 240 # Rolling window for calibration stats
  min_calibration_points: 60     # Warmup before trading

  # Timing parameters
  default_hold_seconds: 300     # 5-minute hold (from analysis)
  max_hold_seconds: 600         # Maximum hold time
  min_time_between_trades_ms: 1000  # Minimum time between trades

# Pattern-Based Trading Rules (from L2 analysis Jan 2026)
# These run in parallel with the original OBI momentum rule
pattern_rules:
  # Rule 1: OBI momentum + depth (lift=3.00x, strongest signal)
  rule1_enabled: true
  rule1_d_obi_30s: 0.2          # d_obi_1_30s threshold
  rule1_depth_ask: 25000        # depth_ask threshold ($k)
  
  # Rule 2: Bid depth + OBI change (lift=2.59x)
  rule2_enabled: true
  rule2_depth_bid: 25000        # depth_bid threshold ($k) - UPDATED to match scanner validation
  rule2_d_obi_15s: 0.1          # d_obi_1_15s threshold
  
  # Rule 3: High OBI + depth (lift=2.29x)
  rule3_enabled: true
  rule3_obi_1: 0.1              # obi_1 threshold
  rule3_depth_ask: 30000        # depth_ask threshold ($k)

# Size Signal (Large Order Detection) - from statistical analysis Jan 2026
# Large bid depth → LONG (informed buying), Large ask depth → SHORT (informed selling)
size_signal:
  enabled: true
  percentile: 99                # Dynamic threshold: 99th percentile (validated by analysis)
  min_depth_k: 5                # Minimum absolute threshold ($5k - lower is better)
  warmup_depth_k: 25            # Base threshold during warmup ($25k, scaled by price)
  warmup_samples: 120           # Samples needed before using percentile (~2 min)
  lookback: 300                 # Rolling window for percentile calc (5 min)
  cooldown_sec: 30              # Minimum seconds between signals per symbol

# Resistance Signal (AAA Quality Trades) - from statistical analysis Jan 2026
# Price rejection at institutional distribution zones → SHORT only
# Expected: +12 bps @ 300s, 5-20 signals/day (vs 50-100 for size signal)
resistance_signal:
  enabled: true
  
  # Level qualification (strict criteria for AAA quality)
  min_touches: 20               # Minimum touches to qualify as level
  min_large_order_ratio: 0.50   # 50%+ touches must have large orders
  min_recent_touches: 3         # Must have 3+ touches in last hour
  price_tolerance: 0.005        # ±0.5% price clustering
  lookback_hours: 4             # Look back 4 hours for level detection
  
  # Signal qualification (strict)
  approach_tolerance: 0.002     # Must be within 0.2% below level
  min_imbalance: -0.2           # Require ask-heavy book (selling pressure)
  cooldown_sec: 300             # 5 min cooldown per level
  tod_filter: "closing"         # Only trade during closing (15:30-16:00 ET)

# Context-Aware Filtering (from correlation analysis)
# Hard gates DOUBLE profit: $201 -> $402, win rate 58% -> 85%
context_gates:
  # Hard gates - block trades in unfavorable regimes
  hard:
    block_vol_expansion: true   # -1.54 bps when vol expanding (CRITICAL)
    block_bb_squeeze: true      # -0.88 bps during consolidation (CRITICAL)
    block_vol_contraction: false # Optional, disabled
  
  # Soft gates DISABLED - backtest showed no benefit (-$19)
  # soft:
  #   rsi_boost_threshold: 70
  #   use_displacement_boost: true
  #   use_counter_momentum: true

# Symbol Configuration - DYNAMIC FROM DAILY SIP
# Symbols loaded at runtime from /home/jacobw/intraday_stack/data/daily_sip/
# See src/data/sip_integration.py for loading logic
symbols:
  # Default parameters applied to all SIP-selected symbols
  defaults:
    max_spread: 0.03
    median_spread: 0.015
    
# Time-of-day adjustments (applied to all symbols)
time_adjustments:
  defaults:
    "09:30-10:00": 1.1          # Opening volatility boost
    "10:00-15:30": 1.0          # Normal trading
    "15:30-16:00": 0.9          # Reduce near close

# Automatic Scheduling
schedule:
  auto_start: true             # Automatically start/stop with market hours
  pre_market_buffer_minutes: 5 # Start 5 minutes before market open
  post_market_buffer_minutes: 5 # Stop 5 minutes after market close
  eod_flatten_time: "15:55"    # Force flatten positions at 3:55 PM ET
