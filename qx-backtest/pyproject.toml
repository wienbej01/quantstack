[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qx-backtest"
version = "0.1.0"
description = "Event-driven backtesting engine and entry/exit AB testing framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "qx-core",
    "qx-data",
    "qx-features",
    "qx-screener",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qx_backtest"]